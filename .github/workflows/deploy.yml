name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned blog commit
        id: blog
        run: echo "sha=$(git rev-parse HEAD:third_party/blog)" >> "$GITHUB_OUTPUT"

      - name: Check out the private blog
        uses: actions/checkout@v7
        with:
          repository: kvvng/blog
          ref: ${{ steps.blog.outputs.sha }}
          path: third_party/blog
          ssh-key: ${{ secrets.BLOG_DEPLOY_KEY }}
          persist-credentials: false

      - uses: withastro/action@v6
        with:
          node-version: "24.21.0"
          build-cmd: npm run check && npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
